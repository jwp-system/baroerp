{% extends "inventory/_layout.html" %}
{% block head_actions %}<a class="btn btn-weak" href="/inventory/transfers">창고 이동</a><a class="btn" href="/inventory/disposals/new">폐기 등록</a>{% endblock %}
{% block inventory %}
<section class="card">
  <form class="filters" hx-get="/inventory" hx-target="#stock-table" hx-push-url="true"
        hx-trigger="change, keyup changed delay:400ms from:input[name=q], submit">
    <div class="field grow">
      <label for="q">검색</label>
      <input class="input input-sm" id="q" name="q" value="{{ f.q }}" placeholder="품목명 또는 식별코드">
    </div>
    <div class="field">
      <label for="group">품목그룹</label>
      <select class="input input-sm" id="group" name="group">
        <option value="">전체</option>
        {% for g, depth in groups %}
        <option value="{{ g.id }}" {% if f.group == g.id %}selected{% endif %}>{{ '　' * depth }}{{ g.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="warehouse">창고</label>
      <select class="input input-sm" id="warehouse" name="warehouse">
        <option value="">전체 창고</option>
        {% for w in warehouses %}<option value="{{ w.id }}" {% if f.warehouse == w.id %}selected{% endif %}>{{ w.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="has_stock">품목</label>
      <select class="input input-sm" id="has_stock" name="has_stock">
        <option value="">사용 중인 품목</option>
        <option value="1" {% if f.has_stock == '1' %}selected{% endif %}>재고 있는 품목만</option>
      </select>
    </div>
    <div class="field">
      <label for="start">폐기 누계 기간</label>
      <div class="input-group">
        <input class="input input-sm" type="date" id="start" name="start" value="{{ f.start }}">
        <input class="input input-sm" type="date" name="end" value="{{ f.end }}" aria-label="종료일">
      </div>
    </div>
    <button type="button" class="btn btn-weak btn-sm"
            onclick="location.href='/inventory/export.xlsx?' + new URLSearchParams(new FormData(this.form))">엑셀 내보내기</button>
  </form>
  <div id="stock-table">{% include "inventory/_stock_table.html" %}</div>
</section>
{% endblock %}
